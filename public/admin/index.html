<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQORA Admin</title><style>:root{--bg:#f5f0e8;--card:#fffaf3;--ink:#17130f;--muted:#74695c;--line:#e4d9ca;--gold:#b68e56;--dark:#17130f}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 28%),linear-gradient(135deg,#f8f4ed,#ece3d6 50%,#f9f6f1);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:1200px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:58px;height:58px;object-fit:cover;border-radius:16px;box-shadow:0 10px 25px #0002}.brand h1{font-family:Georgia,serif;font-weight:500;margin:0;font-size:32px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:14px;padding:11px 16px;background:linear-gradient(135deg,#17130f,#33291e);color:#fff;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:#111;border:1px solid var(--line)}.btn.danger{background:#7f1d1d}.login{max-width:440px;margin:11vh auto;background:rgba(255,255,255,.9);padding:28px;border-radius:24px;box-shadow:0 24px 70px #503a1d1f;border:1px solid #fff}.login h2{font-family:Georgia,serif;font-size:34px;font-weight:500;margin:0 0 10px}.login p{color:var(--muted);line-height:1.6}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:800;color:#685844}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer}.tab.active{background:var(--dark);color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat{background:rgba(255,255,255,.82);border:1px solid #fff;padding:20px;border-radius:18px;box-shadow:0 10px 28px #4b371f12}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.panel{background:rgba(255,255,255,.86);border:1px solid #fff;border-radius:22px;padding:18px;box-shadow:0 16px 45px #4a331c14}.row{display:grid;grid-template-columns:90px 1.5fr .8fr .8fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row img{width:78px;height:78px;object-fit:cover;border-radius:14px}.muted{color:var(--muted);font-size:12px}.order{padding:16px 0;border-bottom:1px solid var(--line)}.order:last-child{border-bottom:0}.order-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.order h3{margin:0 0 6px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{background:#f1e9dc;padding:6px 9px;border-radius:999px;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:12px;background:#fff3cd;color:#6b5412;margin:12px 0}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.box{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}@media(max-width:800px){.stats{grid-template-columns:1fr}.row{grid-template-columns:70px 1fr}.row>*:nth-child(n+3){grid-column:2}.grid2{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.brand h1{font-size:27px}}</style></head><body><div id="login" class="login"><h2>UNIQORA Owner Login</h2><p>Enter your admin password to manage orders and products.</p><div class="field"><label>Admin password</label><input id="password" type="password" placeholder="Enter password"></div><button class="btn" style="width:100%" onclick="login()">Open Dashboard</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></div><main id="app" class="wrap hidden"><div class="topbar"><div class="brand"><img src="/assets/Screenshot_20260912-225337.jpg" alt="UNIQORA"><div><h1>Owner Dashboard</h1><p>Manage UNIQORA orders, stock and products</p></div></div><div><a class="btn light" href="/" target="_blank">View Store</a> <button class="btn" onclick="logout()">Logout</button></div></div><div class="stats"><div class="stat"><b id="orderCount">0</b><span>Total Orders</span></div><div class="stat"><b id="pendingCount">0</b><span>Pending Orders</span></div><div class="stat"><b id="productCount">0</b><span>Products</span></div></div><div class="tabs"><button id="tabOrders" class="tab active" onclick="showTab('orders')">Orders</button><button id="tabProducts" class="tab" onclick="showTab('products')">Products</button><button class="tab" onclick="openAdd()">+ Add Product</button></div><section id="ordersPanel" class="panel"></section><section id="productsPanel" class="panel hidden"></section></main><div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="formTitle">Edit Product</h2><button class="btn light" onclick="closeModal()">✕</button></div><form id="productForm" onsubmit="saveProduct(event)"><input type="hidden" name="id"><div class="grid2"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Category</label><input name="category" required></div><div class="field"><label>Price</label><input name="price" type="number" required></div><div class="field"><label>Compare at price</label><input name="compareAt" type="number"></div><div class="field"><label>Stock</label><input name="stock" type="number" required></div><div class="field"><label>Badge</label><input name="badge"></div></div><div class="field"><label>Image path</label><input name="image" placeholder="/assets/products/image.png" required></div><div class="field"><label>Description</label><textarea name="description" rows="4"></textarea></div><button class="btn" type="submit">Save Product</button></form></div></div><script>let token=sessionStorage.getItem('uq_admin')||'',products=[],orders=[];const $=s=>document.querySelector(s);async function api(url,opts={}){opts.headers={...(opts.headers||{}),'x-admin-token':token};if(opts.body&&!opts.headers['Content-Type'])opts.headers['Content-Type']='application/json';let r=await fetch(url,opts);if(r.status===401)throw new Error('Unauthorized');let d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function login(){token=$('#password').value.trim();if(!token)return;$('#loginMsg').textContent='Checking...';try{await api('/api/admin/orders');sessionStorage.setItem('uq_admin',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await loadAll()}catch(e){$('#loginMsg').textContent='Wrong admin password.'}}function logout(){sessionStorage.removeItem('uq_admin');location.reload()}async function loadAll(){orders=await api('/api/admin/orders');products=await fetch('/api/products').then(r=>r.json());renderStats();renderOrders();renderProducts()}function renderStats(){$('#orderCount').textContent=orders.length;$('#pendingCount').textContent=orders.filter(o=>o.status==='Pending').length;$('#productCount').textContent=products.length}function showTab(x){$('#ordersPanel').classList.toggle('hidden',x!=='orders');$('#productsPanel').classList.toggle('hidden',x!=='products');$('#tabOrders').classList.toggle('active',x==='orders');$('#tabProducts').classList.toggle('active',x==='products')}function renderOrders(){$('#ordersPanel').innerHTML=orders.length?orders.map(o=>`<div class="order"><div class="order-head"><div><h3>${o.id}</h3><div class="muted">${new Date(o.createdAt).toLocaleString('en-IN')}</div></div><select onchange="updateStatus('${o.id}',this.value)">${['Pending','Confirmed','Shipped','Delivered','Cancelled','Paid'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><p><b>${o.customer?.name||''}</b> · ${o.customer?.phone||''}<br><span class="muted">${o.customer?.address||''}</span></p><div class="chips">${(o.items||[]).map(i=>`<span class="chip">${i.name} × ${i.qty}</span>`).join('')}</div><p><b>Total: ₹${Number(o.total||0).toLocaleString('en-IN')}</b> · ${o.paymentMethod||'cod'}</p></div>`).join(''):'<p>No orders yet.</p>'}async function updateStatus(id,status){await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status})});orders=await api('/api/admin/orders');renderStats();renderOrders()}function renderProducts(){$('#productsPanel').innerHTML=products.map(p=>`<div class="row"><img src="${p.image}" alt=""><div><b>${p.name}</b><div class="muted">${p.category}</div></div><div>₹${Number(p.price).toLocaleString('en-IN')}</div><div>Stock: ${p.stock}</div><div><button class="btn light" onclick="editProduct(${p.id})">Edit</button> <button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></div></div>`).join('')}function openAdd(){let f=$('#productForm');f.reset();f.id.value='';$('#formTitle').textContent='Add Product';$('#modal').classList.add('open')}function editProduct(id){let p=products.find(x=>x.id===id),f=$('#productForm');for(let k of ['id','name','category','price','compareAt','stock','badge','image','description'])if(f[k])f[k].value=p[k]??'';$('#formTitle').textContent='Edit Product';$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}async function saveProduct(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let id=f.id;delete f.id;f.price=Number(f.price);f.compareAt=Number(f.compareAt||0);f.stock=Number(f.stock||0);if(id)await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify(f)});else await api('/api/admin/products',{method:'POST',body:JSON.stringify(f)});closeModal();await loadAll();showTab('products')}async function deleteProduct(id){if(!confirm('Delete this product?'))return;await api('/api/admin/products/'+id,{method:'DELETE'});await loadAll();showTab('products')}if(token){api('/api/admin/orders').then(()=>{ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadAll()}).catch(()=>sessionStorage.removeItem('uq_admin'))}</script></body></html>
