<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQORA — Unique Products</title><style>:root{--ink:#17130f;--muted:#71685d;--line:#e7dfd3;--gold:#b79a70}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 8% 8%,rgba(255,255,255,.98),transparent 24%),radial-gradient(circle at 92% 20%,rgba(200,164,117,.18),transparent 30%),linear-gradient(135deg,#f9f6f0 0%,#eee6da 48%,#faf8f4 100%);background-attachment:fixed;min-height:100vh}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.top{background:linear-gradient(90deg,#080808,#292218,#080808);color:#fff;text-align:center;padding:10px;font-size:11px;letter-spacing:1.2px}.top:after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,#b79a70,transparent);transform:translateY(10px)}header{height:82px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(177,146,105,.2);display:flex;align-items:center;padding:0 5%;gap:25px;position:sticky;top:0;z-index:10;box-shadow:0 10px 30px rgba(48,35,20,.05)}.logo{width:168px;height:58px;overflow:hidden;border-radius:10px;background:#000;display:block;box-shadow:0 7px 20px rgba(0,0,0,.12)}.logo img{width:100%;height:100%;object-fit:cover;object-position:50% 69%;display:block;transform:scale(1.03)}.nav{display:flex;gap:30px;margin:auto;font-size:13px;font-weight:800}.nav a{position:relative;padding:10px 0}.nav a:after{content:'';position:absolute;left:0;bottom:4px;width:0;height:1px;background:#111;transition:.25s}.nav a:hover:after{width:100%}.actions{display:flex;gap:8px}.round{border:1px solid rgba(90,73,48,.14);background:rgba(255,255,255,.9);border-radius:50%;width:42px;height:42px;cursor:pointer;box-shadow:0 8px 20px rgba(55,40,22,.07)}.hero{position:relative;isolation:isolate;max-width:1400px;margin:28px auto;padding:7%;min-height:590px;border-radius:36px;overflow:hidden;background:linear-gradient(120deg,rgba(247,241,231,.98),rgba(226,209,182,.95) 55%,rgba(181,144,101,.84));display:flex;align-items:center;border:1px solid rgba(255,255,255,.72);box-shadow:0 30px 80px rgba(75,51,25,.16)}.hero:before{content:'';position:absolute;z-index:-1;width:560px;height:560px;border-radius:50%;right:-90px;top:-190px;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(255,255,255,0) 68%)}.hero small{display:inline-block;letter-spacing:2.3px;font-weight:800;font-size:11px;color:#6c5a43;background:rgba(255,255,255,.54);padding:8px 12px;border:1px solid rgba(115,89,52,.16);border-radius:999px}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(56px,8vw,104px);font-weight:500;line-height:.86;letter-spacing:-5px;margin:22px 0;color:#15130f}.hero p{max-width:560px;color:#5e554a;line-height:1.75;font-size:17px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:14px 23px;background:linear-gradient(135deg,#111,#2b241b);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(20,15,10,.16);transition:.2s}.btn:hover{transform:translateY(-2px)}.light{background:rgba(255,255,255,.9);color:#111;border:1px solid var(--line)}.section{max-width:1400px;margin:78px auto;padding:0 5%}.section h2{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-weight:500;letter-spacing:-1.7px;margin:0 0 12px}.section-sub{color:var(--muted);margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.94);border-radius:24px;overflow:hidden;box-shadow:0 15px 40px rgba(74,54,31,.09);transition:.25s}.card:hover{transform:translateY(-6px);box-shadow:0 24px 55px rgba(74,54,31,.15)}.card a{overflow:hidden;display:block}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;transition:.4s}.card:hover img{transform:scale(1.035)}.body{padding:17px}.cat{font-size:9px;color:#9a7f5b;text-transform:uppercase;letter-spacing:1.35px;font-weight:800}.card h3{font-size:16px;margin:8px 0;line-height:1.25}.price{font-weight:900}.old{text-decoration:line-through;color:#aaa;font-size:12px;margin-left:5px}.add{width:100%;margin-top:14px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.filter{border:1px solid rgba(134,107,72,.18);background:rgba(255,255,255,.76);border-radius:999px;padding:11px 17px;cursor:pointer;font-weight:700}.filter.active{background:#17130f;color:#fff}.category-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.category-card{min-height:190px;border-radius:26px;padding:26px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(235,223,205,.84));border:1px solid rgba(255,255,255,.9);box-shadow:0 16px 40px rgba(74,54,31,.08);display:flex;flex-direction:column;justify-content:flex-end;transition:.25s}.category-card:hover{transform:translateY(-5px)}.category-card b{font-family:Georgia,'Times New Roman',serif;font-size:28px}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.trust-item{background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:24px;box-shadow:0 12px 30px rgba(74,54,31,.07)}.trust-item b{display:block;font-size:16px;margin-bottom:7px}.trust-item p{margin:0;color:var(--muted);line-height:1.6}.banner{max-width:1400px;margin:80px auto;padding:0 5%}.banner-in{border-radius:30px;padding:42px;background:linear-gradient(125deg,#181510,#33281d 55%,#7e6548);color:#fff;box-shadow:0 25px 60px rgba(35,25,16,.2)}.banner-in h2{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-weight:500;margin:0 0 12px}.banner-in p{color:#ded4c6;max-width:620px;line-height:1.7}.drawer{position:fixed;right:-430px;top:0;height:100%;width:min(430px,100%);background:rgba(255,255,255,.98);z-index:20;padding:22px;transition:.25s;box-shadow:-10px 0 35px #0002;display:flex;flex-direction:column}.drawer.open{right:0}.cart{flex:1;overflow:auto}.row{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.row img{width:65px;height:65px;object-fit:cover;border-radius:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.open{display:flex}.box{background:#fff;border-radius:24px;padding:25px;width:min(600px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:11px}.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.pay-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay-option{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;align-items:center;gap:9px;background:#faf8f4;font-weight:700}.pay-option input{width:auto}.secure-note{font-size:12px;color:var(--muted);line-height:1.5}.wa{position:fixed;right:20px;bottom:20px;background:linear-gradient(135deg,#17130f,#342a20);color:#fff;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;font-size:24px;z-index:15;box-shadow:0 12px 28px rgba(0,0,0,.2)}footer{background:linear-gradient(135deg,#11100e,#201a14);color:#fff;padding:55px 5%;margin-top:80px;border-top:1px solid #413527}footer p{color:#cfc5b8}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.nav{display:none}.hero{margin:18px 16px}.section{margin:58px auto}.category-cards,.trust{grid-template-columns:1fr}.banner{margin:58px auto}}@media(max-width:560px){header{height:72px;padding:0 4%}.logo{width:118px;height:44px;border-radius:8px}.round{width:38px;height:38px}.hero{margin:12px 10px;padding:10% 7%;min-height:500px;border-radius:26px}.hero h1{font-size:56px;letter-spacing:-3px}.hero p{font-size:15px}.section{margin:50px auto;padding:0 5%}.section h2{font-size:34px}.grid{gap:12px}.card{border-radius:18px}.body{padding:12px}.card h3{font-size:13px}.btn{padding:12px 16px}.filter{font-size:12px;padding:9px 12px}.banner-in{padding:30px 24px}.banner-in h2{font-size:34px}.pay-choice{grid-template-columns:1fr}}</style></head><body><div class="top">FREE SHIPPING ON ORDERS ABOVE ₹999 • COD AVAILABLE • WHATSAPP ORDERS</div><header><a class="logo" href="#/" aria-label="UNIQORA Home"><img src="/assets/Screenshot_20260912-225337.jpg" alt="UNIQORA"></a><nav class="nav"><a href="#/shop">All Products</a><a href="#/shop?cat=Mugs">Mugs</a><a href="#/shop?cat=Ashtrays">Ashtray</a></nav><div class="actions"><button class="round" onclick="location.hash='#/shop'">⌕</button><button class="round" onclick="openCart()">🛒 <span id="count">0</span></button></div></header><div id="app"></div><a class="wa" href="https://api.whatsapp.com/send?phone=918683038584&text=Hi%20UNIQORA%2C%20I%20want%20to%20shop." target="_blank" rel="noopener noreferrer">💬</a><div id="drawer" class="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Cart</h2><button class="round" onclick="closeCart()">×</button></div><div id="cart" class="cart"></div><div><h3>Total: <span id="total">₹0</span></h3><button class="btn" style="width:100%" onclick="checkout()">Checkout</button></div></div><div id="modal" class="modal"><div id="box" class="box"></div></div><script>let products=[],cart=JSON.parse(localStorage.getItem('uqcart')||'[]'),filter='All';const $=x=>document.querySelector(x),money=n=>'₹'+Number(n).toLocaleString('en-IN');const mugCats=['Novelty Mugs & Cups','Cups & Drinkware','Retro Collectibles'];const ashCats=['Ashtrays & Desk Décor'];async function load(){products=await fetch('/api/products').then(r=>r.json());cart=cart.filter(x=>products.some(p=>p.id===x.id));save();route()}function save(){localStorage.setItem('uqcart',JSON.stringify(cart));renderCart()}function add(id){let p=products.find(x=>x.id===id);if(!p||!p.stock)return alert('Out of stock');let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});save();openCart()}function change(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(x=>x.id!==id);save()}function renderCart(){let total=0;$('#count').textContent=cart.reduce((s,x)=>s+x.qty,0);$('#cart').innerHTML=cart.length?cart.map(x=>{let p=products.find(p=>p.id===x.id);if(!p)return'';total+=p.price*x.qty;return `<div class="row"><img src="${p.image}"><div style="flex:1"><b>${p.name}</b><div>${money(p.price)} × ${x.qty}</div><button onclick="change(${p.id},-1)">−</button> <button onclick="change(${p.id},1)">+</button></div></div>`}).join(''):'<p>Your cart is empty.</p>';$('#total').textContent=money(total)}function openCart(){$('#drawer').classList.add('open')}function closeCart(){$('#drawer').classList.remove('open')}function card(p){return `<article class="card"><a href="#/product/${p.id}"><img src="${p.image}" alt="${p.name}"></a><div class="body"><div class="cat">${p.category}</div><h3>${p.name}</h3><div class="price">${money(p.price)} <span class="old">${money(p.compareAt)}</span></div><button class="btn add" onclick="add(${p.id})">Add to Cart</button></div></article>`}function home(){return `<main><section class="hero"><div><small>UNIQORA STORE</small><h1>Find<br>Something<br>Different.</h1><p>Distinctive mugs, statement ashtrays and curated objects made for people who like products with personality.</p><div class="hero-actions"><a class="btn" href="#/shop">Shop All Products</a><a class="btn light" href="#/shop?cat=Mugs">Explore Mugs</a></div></div></section><section class="section"><h2>Shop Your Style</h2><p class="section-sub">Three simple collections, arranged by product type.</p><div class="category-cards"><a class="category-card" href="#/shop"><b>All Products</b></a><a class="category-card" href="#/shop?cat=Mugs"><b>Mugs</b></a><a class="category-card" href="#/shop?cat=Ashtrays"><b>Ashtray</b></a></div></section><section class="section"><h2>Featured Collection</h2><p class="section-sub">A few standout pieces from UNIQORA.</p><div class="grid">${products.slice(0,4).map(card).join('')}</div></section><section class="banner"><div class="banner-in"><h2>Small objects. Big personality.</h2><p>UNIQORA brings together unusual, giftable and conversation-starting products with a clean premium shopping experience.</p><a class="btn light" href="#/shop">View Collection</a></div></section><section class="section"><h2>Why UNIQORA</h2><div class="trust"><div class="trust-item"><b>Curated Products</b><p>Distinctive pieces selected for design, personality and gifting appeal.</p></div><div class="trust-item"><b>Cash on Delivery</b><p>Simple ordering with COD available for supported locations.</p></div><div class="trust-item"><b>Secure Online Payments</b><p>Pay safely through Razorpay using supported UPI, cards and other available methods.</p></div></div></section></main><footer><b>UNIQORA</b><p>Unique Products. Better You.</p></footer>`}function shop(){filter=new URLSearchParams(location.hash.split('?')[1]||'').get('cat')||'All';let title=filter==='Mugs'?'Mugs':filter==='Ashtrays'?'Ashtray Collection':'All Products';return `<main><section class="section"><h2>${title}</h2><div class="filters">${['All','Mugs','Ashtrays'].map(x=>`<button class="filter ${filter===x?'active':''}" onclick="filter='${x}';renderShop()">${x==='Ashtrays'?'Ashtray':x==='All'?'All Products':x}</button>`).join('')}</div><div id="grid" class="grid"></div></section></main>`}function inGroup(p){if(filter==='All')return true;if(filter==='Mugs')return mugCats.includes(p.category);if(filter==='Ashtrays')return ashCats.includes(p.category);return true}function renderShop(){let a=products.filter(inGroup);$('#grid').innerHTML=a.map(card).join('')||'<p>No products found.</p>'}function product(id){let p=products.find(x=>x.id===+id);if(!p)return `<main><section class="section"><h2>Product not found</h2><a class="btn" href="#/shop">Back to Shop</a></section></main>`;return `<main><section class="section"><div style="max-width:700px;margin:auto"><img src="${p.image}" style="width:100%;border-radius:22px;box-shadow:0 24px 60px rgba(70,50,28,.16)"><div class="cat" style="margin-top:25px">${p.category}</div><h2>${p.name}</h2><h3>${money(p.price)} <span class="old">${money(p.compareAt)}</span></h3><p style="color:#666;line-height:1.7">${p.description}</p><button class="btn" onclick="add(${p.id})">Add to Cart</button> <a class="btn light" target="_blank" rel="noopener noreferrer" href="https://api.whatsapp.com/send?phone=918683038584&text=${encodeURIComponent('Hi UNIQORA, I want '+p.name+' for '+money(p.price))}">WhatsApp Order</a></div></section></main>`}function checkout(){if(!cart.length)return alert('Your cart is empty');$('#modal').classList.add('open');$('#box').innerHTML=`<h2>Checkout</h2><form class="form" onsubmit="place(event)"><input name="name" placeholder="Full name" required><input name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required><input name="email" type="email" placeholder="Email"><textarea name="address" rows="3" placeholder="Full delivery address" required></textarea><input name="city" placeholder="City" required><input name="pincode" pattern="[0-9]{6}" placeholder="Pincode" required><b>Payment Method</b><div class="pay-choice"><label class="pay-option"><input type="radio" name="paymentMethod" value="cod" checked> Cash on Delivery</label><label class="pay-option"><input type="radio" name="paymentMethod" value="razorpay"> Pay Online</label></div><div class="secure-note">Online payments are processed securely through Razorpay. Available UPI/card options may depend on your Razorpay account and checkout availability.</div><button class="btn">Continue</button><button type="button" class="btn light" onclick="closeModal()">Cancel</button></form>`}function loadRazorpay(){return new Promise((resolve,reject)=>{if(window.Razorpay)return resolve();let s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=resolve;s.onerror=()=>reject(new Error('Could not load Razorpay checkout'));document.head.appendChild(s)})}async function place(e){e.preventDefault();let btn=e.submitter;if(btn){btn.disabled=true;btn.textContent='Please wait...'}try{let f=Object.fromEntries(new FormData(e.target));let paymentMethod=f.paymentMethod||'cod';f.address=`${f.address}, ${f.city} - ${f.pincode}`;delete f.city;delete f.pincode;delete f.paymentMethod;let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart,customer:f,paymentMethod})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Order failed');if(paymentMethod==='cod'){cart=[];save();closeModal();closeCart();alert('Order placed! Order ID: '+d.orderId);location.hash='#/';return}await loadRazorpay();let options={key:d.keyId,amount:d.amount,currency:'INR',name:'UNIQORA',description:'UNIQORA Order '+d.orderId,order_id:d.razorpayOrderId,prefill:{name:f.name,contact:f.phone,email:f.email||''},theme:{color:'#17130f'},handler:async function(resp){let vr=await fetch('/api/payment/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:d.orderId,...resp})}),vd=await vr.json();if(!vr.ok)return alert(vd.error||'Payment verification failed. Please contact support with Order ID '+d.orderId);cart=[];save();closeModal();closeCart();alert('Payment successful! Order ID: '+d.orderId);location.hash='#/'} };let rz=new Razorpay(options);rz.on('payment.failed',function(){alert('Payment was not completed. You can retry from checkout. Order ID: '+d.orderId)});rz.open();}catch(err){alert(err.message||'Something went wrong')}finally{if(btn){btn.disabled=false;btn.textContent='Continue'}}}function closeModal(){$('#modal').classList.remove('open')}function route(){let h=location.hash||'#/',p=h.split('?')[0];if(p==='#/'||p==='#')$('#app').innerHTML=home();else if(p==='#/shop'){$('#app').innerHTML=shop();renderShop()}else if(p.startsWith('#/product/'))$('#app').innerHTML=product(p.split('/')[2]);else $('#app').innerHTML=home()}addEventListener('hashchange',route);load();</script></body></html>
