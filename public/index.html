<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQORA — Unique Products</title><style>:root{--bg:#f7f5f0;--ink:#171717;--muted:#777;--line:#e7e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}.top{background:#111;color:#fff;text-align:center;padding:9px;font-size:12px;letter-spacing:.4px}header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:25px;position:sticky;top:0;z-index:10}.logo{font-size:27px;font-weight:950;letter-spacing:3px}.nav{display:flex;gap:24px;margin:auto;font-size:14px;font-weight:700}.actions{display:flex;gap:8px}.round{border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer}.hero{max-width:1400px;margin:18px auto;padding:7%;min-height:520px;border-radius:28px;background:linear-gradient(120deg,#ddd9d0,#f3eadc 60%,#d1c2ac);display:flex;align-items:center}.hero h1{font-size:clamp(52px,8vw,100px);line-height:.88;letter-spacing:-5px;margin:16px 0}.hero p{max-width:580px;color:#555;line-height:1.7;font-size:18px}.btn{display:inline-flex;border:0;border-radius:999px;padding:13px 21px;background:#111;color:#fff;font-weight:800;cursor:pointer}.light{background:#fff;color:#111;border:1px solid var(--line)}.section{max-width:1400px;margin:65px auto;padding:0 5%}.section h2{font-size:36px;letter-spacing:-2px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #eee;border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.body{padding:15px}.cat{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px}.card h3{font-size:16px;margin:7px 0}.price{font-weight:900}.old{text-decoration:line-through;color:#999;font-size:12px;margin-left:5px}.add{width:100%;margin-top:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.filter.active{background:#111;color:#fff}.drawer{position:fixed;right:-430px;top:0;height:100%;width:min(430px,100%);background:#fff;z-index:20;padding:22px;transition:.25s;box-shadow:-10px 0 35px #0002;display:flex;flex-direction:column}.drawer.open{right:0}.cart{flex:1;overflow:auto}.row{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.row img{width:65px;height:65px;object-fit:cover;border-radius:9px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:25px;width:min(600px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:11px}.form input,.form textarea{border:1px solid var(--line);border-radius:10px;padding:12px}.wa{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-size:24px;z-index:15}footer{background:#111;color:#fff;padding:45px 5%;margin-top:70px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.nav{display:none}}@media(max-width:560px){.hero{margin:10px;padding:9%;min-height:500px}.hero h1{font-size:52px}.section{margin:45px auto}.grid{gap:10px}.card h3{font-size:14px}}</style></head><body><div class="top">FREE SHIPPING ON ORDERS ABOVE ₹999 • COD AVAILABLE • WHATSAPP ORDERS</div><header><a class="logo" href="#/">UNIQORA</a><nav class="nav"><a href="#/">Home</a><a href="#/shop">Shop All</a><a href="#/shop?cat=Novelty%20Mugs%20%26%20Cups">Mugs & Cups</a><a href="#/shop?cat=Home%20Décor%20%26%20Trays">Home Décor</a></nav><div class="actions"><button class="round" onclick="location.hash='#/shop'">⌕</button><button class="round" onclick="openCart()">🛒 <span id="count">0</span></button></div></header><div id="app"></div><a class="wa" href="https://wa.me/91868303584?text=Hi%20UNIQORA%2C%20I%20want%20to%20shop." target="_blank">💬</a><div id="drawer" class="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Cart</h2><button class="round" onclick="closeCart()">×</button></div><div id="cart" class="cart"></div><div><h3>Total: <span id="total">₹0</span></h3><button class="btn" style="width:100%" onclick="checkout()">Checkout</button></div></div><div id="modal" class="modal"><div id="box" class="box"></div></div><script>let products=[],cart=JSON.parse(localStorage.getItem('uqcart')||'[]'),filter='All';const $=x=>document.querySelector(x),money=n=>'₹'+Number(n).toLocaleString('en-IN');async function load(){products=await fetch('/api/products').then(r=>r.json());route();renderCart()}function save(){localStorage.setItem('uqcart',JSON.stringify(cart));renderCart()}function add(id){let p=products.find(x=>x.id===id);if(!p||!p.stock)return alert('Out of stock');let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});save();openCart()}function change(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(x=>x.id!==id);save()}function renderCart(){let total=0;$('#count').textContent=cart.reduce((s,x)=>s+x.qty,0);$('#cart').innerHTML=cart.length?cart.map(x=>{let p=products.find(p=>p.id===x.id);total+=p.price*x.qty;return `<div class="row"><img src="${p.image}"><div style="flex:1"><b>${p.name}</b><div>${money(p.price)} × ${x.qty}</div><button onclick="change(${p.id},-1)">−</button> <button onclick="change(${p.id},1)">+</button></div></div>`}).join(''):'<p>Your cart is empty.</p>';$('#total').textContent=money(total)}function openCart(){$('#drawer').classList.add('open')}function closeCart(){$('#drawer').classList.remove('open')}function card(p){return `<article class="card"><a href="#/product/${p.id}"><img src="${p.image}" alt="${p.name}"></a><div class="body"><div class="cat">${p.category}</div><h3>${p.name}</h3><div class="price">${money(p.price)} <span class="old">${money(p.compareAt)}</span></div><button class="btn add" onclick="add(${p.id})">Add to Cart</button></div></article>`}function home(){return `<main><section class="hero"><div><small>UNIQORA STORE</small><h1>Find<br>Something<br>Different.</h1><p>Unique, useful and giftable products curated for people who like things with personality.</p><a class="btn" href="#/shop">Shop Collection</a></div></section><section class="section"><h2>Trending Now</h2><div class="grid">${products.slice(0,4).map(card).join('')}</div></section><section class="section"><h2>Shop by Category</h2><div class="filters">${['Novelty Mugs & Cups','Home Décor & Trays','Ashtrays & Desk Décor','Cups & Drinkware'].map(x=>`<a class="filter" href="#/shop?cat=${encodeURIComponent(x)}">${x}</a>`).join('')}</div></section></main><footer><b>UNIQORA</b><p>Unique Products. Made to Stand Out.</p></footer>`}function shop(){let q=new URLSearchParams(location.hash.split('?')[1]||'').get('cat')||'All';filter=q;return `<main><section class="section"><h2>Shop All</h2><div class="filters">${['All','Novelty Mugs & Cups','Home Décor & Trays','Ashtrays & Desk Décor','Cups & Drinkware','Stationery & Collectibles','Retro Collectibles'].map(x=>`<button class="filter ${filter===x?'active':''}" onclick="filter='${x.replaceAll("'","\\'")}';renderShop()">${x}</button>`).join('')}</div><div id="grid" class="grid"></div></section></main>`}function renderShop(){let q=($('#search')?.value||'').toLowerCase();let a=products.filter(p=>(filter==='All'||p.category===filter)&&p.name.toLowerCase().includes(q));$('#grid').innerHTML=a.map(card).join('')||'<p>No products found.</p>'}function product(id){let p=products.find(x=>x.id===+id);return `<main><section class="section"><div style="max-width:700px;margin:auto"><img src="${p.image}" style="width:100%;border-radius:22px"><div class="cat" style="margin-top:25px">${p.category}</div><h2>${p.name}</h2><h3>${money(p.price)} <span class="old">${money(p.compareAt)}</span></h3><p style="color:#666;line-height:1.7">${p.description}</p><button class="btn" onclick="add(${p.id})">Add to Cart</button> <a class="btn light" target="_blank" href="https://wa.me/91868303584?text=${encodeURIComponent('Hi UNIQORA, I want '+p.name+' for '+money(p.price))}">WhatsApp Order</a></div></section></main>`}function checkout(){if(!cart.length)return alert('Your cart is empty');$('#modal').classList.add('open');$('#box').innerHTML=`<h2>Checkout</h2><form class="form" onsubmit="place(event)"><input name="name" placeholder="Full name" required><input name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required><input name="email" type="email" placeholder="Email"><textarea name="address" rows="3" placeholder="Full delivery address" required></textarea><input name="city" placeholder="City" required><input name="pincode" pattern="[0-9]{6}" placeholder="Pincode" required><button class="btn">Place COD Order</button><button type="button" class="btn light" onclick="closeModal()">Cancel</button></form>`}async function place(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.address=`${f.address}, ${f.city} - ${f.pincode}`;let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart,customer:f,paymentMethod:'cod'})}),d=await r.json();if(!r.ok)return alert(d.error||'Order failed');cart=[];save();closeModal();closeCart();alert('Order placed! Order ID: '+d.orderId);location.hash='#/'}function closeModal(){$('#modal').classList.remove('open')}function route(){let h=location.hash||'#/',p=h.split('?')[0];if(p==='#/'||p==='#')$('#app').innerHTML=home();else if(p==='#/shop'){$('#app').innerHTML=shop();renderShop()}else if(p.startsWith('#/product/'))$('#app').innerHTML=product(p.split('/')[2]);else $('#app').innerHTML=home()}addEventListener('hashchange',route);load();</script></body></html>
