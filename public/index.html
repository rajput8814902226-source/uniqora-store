<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQORA — Unique Products</title><style>:root{--bg:#f7f5f0;--ink:#171717;--muted:#777;--line:#e7e2d8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 10%,rgba(255,255,255,.95),transparent 26%),radial-gradient(circle at 88% 28%,rgba(214,188,147,.18),transparent 30%),linear-gradient(135deg,#f8f5ef 0%,#eee7dc 48%,#f8f6f2 100%);background-attachment:fixed;color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}.top{background:linear-gradient(90deg,#0b0b0b,#24201b,#0b0b0b);color:#fff;text-align:center;padding:10px;font-size:11px;letter-spacing:1.25px}.top:after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,#b89c72,transparent);transform:translateY(10px)}header{height:78px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(178,154,118,.22);display:flex;align-items:center;padding:0 5%;gap:25px;position:sticky;top:0;z-index:10;box-shadow:0 10px 30px rgba(48,35,20,.05)}.logo{font-size:28px;font-weight:950;letter-spacing:4px}.nav{display:flex;gap:28px;margin:auto;font-size:13px;font-weight:750}.nav a{position:relative;padding:10px 0}.nav a:after{content:'';position:absolute;left:0;bottom:4px;width:0;height:1px;background:#111;transition:.25s}.nav a:hover:after{width:100%}.actions{display:flex;gap:8px}.round{border:1px solid rgba(90,73,48,.14);background:rgba(255,255,255,.86);border-radius:50%;width:42px;height:42px;cursor:pointer;box-shadow:0 8px 20px rgba(55,40,22,.07)}.hero{position:relative;isolation:isolate;max-width:1400px;margin:28px auto;padding:7%;min-height:560px;border-radius:34px;overflow:hidden;background:linear-gradient(120deg,rgba(243,237,226,.98),rgba(225,208,181,.94) 54%,rgba(191,161,124,.78));display:flex;align-items:center;border:1px solid rgba(255,255,255,.7);box-shadow:0 30px 80px rgba(75,51,25,.14)}.hero:before{content:'';position:absolute;z-index:-1;width:520px;height:520px;border-radius:50%;right:-90px;top:-180px;background:radial-gradient(circle,rgba(255,255,255,.78),rgba(255,255,255,0) 67%)}.hero:after{content:'';position:absolute;z-index:-1;inset:auto -10% -45% 30%;height:65%;transform:rotate(-4deg);background:linear-gradient(115deg,transparent,rgba(115,77,40,.08));border-radius:50%}.hero small{display:inline-block;letter-spacing:2.3px;font-weight:800;font-size:11px;color:#6c5a43;background:rgba(255,255,255,.5);padding:8px 12px;border:1px solid rgba(115,89,52,.16);border-radius:999px}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(56px,8vw,104px);font-weight:500;line-height:.86;letter-spacing:-5px;margin:22px 0;color:#15130f;text-shadow:0 1px 0 #fff}.hero p{max-width:560px;color:#5e554a;line-height:1.75;font-size:17px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:14px 23px;background:linear-gradient(135deg,#111,#29231c);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(20,15,10,.16);transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 15px 30px rgba(20,15,10,.2)}.light{background:rgba(255,255,255,.88);color:#111;border:1px solid var(--line)}.section{max-width:1400px;margin:78px auto;padding:0 5%}.section h2{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-weight:500;letter-spacing:-1.7px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.92);border-radius:24px;overflow:hidden;box-shadow:0 15px 40px rgba(74,54,31,.09);transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-6px);box-shadow:0 24px 55px rgba(74,54,31,.15)}.card a{overflow:hidden;display:block}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;transition:transform .4s}.card:hover img{transform:scale(1.035)}.body{padding:17px}.cat{font-size:9px;color:#9a7f5b;text-transform:uppercase;letter-spacing:1.35px;font-weight:800}.card h3{font-size:16px;margin:8px 0;line-height:1.25}.price{font-weight:900}.old{text-decoration:line-through;color:#aaa;font-size:12px;margin-left:5px}.add{width:100%;margin-top:14px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.filter{border:1px solid rgba(134,107,72,.18);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-radius:999px;padding:10px 15px;cursor:pointer;box-shadow:0 6px 18px rgba(53,38,21,.05)}.filter.active{background:#17130f;color:#fff}.drawer{position:fixed;right:-430px;top:0;height:100%;width:min(430px,100%);background:rgba(255,255,255,.97);z-index:20;padding:22px;transition:.25s;box-shadow:-10px 0 35px #0002;display:flex;flex-direction:column}.drawer.open{right:0}.cart{flex:1;overflow:auto}.row{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.row img{width:65px;height:65px;object-fit:cover;border-radius:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.open{display:flex}.box{background:#fff;border-radius:24px;padding:25px;width:min(600px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:11px}.form input,.form textarea{border:1px solid var(--line);border-radius:12px;padding:12px}.wa{position:fixed;right:20px;bottom:20px;background:linear-gradient(135deg,#17130f,#342a20);color:#fff;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;font-size:24px;z-index:15;box-shadow:0 12px 28px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.2)}footer{background:linear-gradient(135deg,#11100e,#201a14);color:#fff;padding:55px 5%;margin-top:80px;border-top:1px solid #413527}footer b{letter-spacing:2px}footer p{color:#cfc5b8}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.nav{display:none}.hero{margin:18px 16px}.section{margin:58px auto}}@media(max-width:560px){header{height:68px;padding:0 4%}.logo{font-size:21px;letter-spacing:3px}.round{width:38px;height:38px}.hero{margin:12px 10px;padding:10% 7%;min-height:485px;border-radius:26px}.hero h1{font-size:56px;letter-spacing:-3px}.hero p{font-size:15px}.section{margin:50px auto;padding:0 5%}.section h2{font-size:34px}.grid{gap:12px}.card{border-radius:18px}.body{padding:12px}.card h3{font-size:13px}.btn{padding:12px 16px}.filter{font-size:12px;padding:9px 12px}}</style></head><body><div class="top">FREE SHIPPING ON ORDERS ABOVE ₹999 • COD AVAILABLE • WHATSAPP ORDERS</div><header><a class="logo" href="#/">UNIQORA</a><nav class="nav"><a href="#/">Home</a><a href="#/shop">Shop All</a><a href="#/shop?cat=Novelty%20Mugs%20%26%20Cups">Mugs & Cups</a><a href="#/shop?cat=Home%20Décor%20%26%20Trays">Home Décor</a></nav><div class="actions"><button class="round" onclick="location.hash='#/shop'">⌕</button><button class="round" onclick="openCart()">🛒 <span id="count">0</span></button></div></header><div id="app"></div><a class="wa" href="https://api.whatsapp.com/send?phone=918683038584&text=Hi%20UNIQORA%2C%20I%20want%20to%20shop." target="_blank" rel="noopener noreferrer">💬</a><div id="drawer" class="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Cart</h2><button class="round" onclick="closeCart()">×</button></div><div id="cart" class="cart"></div><div><h3>Total: <span id="total">₹0</span></h3><button class="btn" style="width:100%" onclick="checkout()">Checkout</button></div></div><div id="modal" class="modal"><div id="box" class="box"></div></div><script>let products=[],cart=JSON.parse(localStorage.getItem('uqcart')||'[]'),filter='All';const $=x=>document.querySelector(x),money=n=>'₹'+Number(n).toLocaleString('en-IN');async function load(){products=await fetch('/api/products').then(r=>r.json());route();renderCart()}function save(){localStorage.setItem('uqcart',JSON.stringify(cart));renderCart()}function add(id){let p=products.find(x=>x.id===id);if(!p||!p.stock)return alert('Out of stock');let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});save();openCart()}function change(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(x=>x.id!==id);save()}function renderCart(){let total=0;$('#count').textContent=cart.reduce((s,x)=>s+x.qty,0);$('#cart').innerHTML=cart.length?cart.map(x=>{let p=products.find(p=>p.id===x.id);total+=p.price*x.qty;return `<div class="row"><img src="${p.image}"><div style="flex:1"><b>${p.name}</b><div>${money(p.price)} × ${x.qty}</div><button onclick="change(${p.id},-1)">−</button> <button onclick="change(${p.id},1)">+</button></div></div>`}).join(''):'<p>Your cart is empty.</p>';$('#total').textContent=money(total)}function openCart(){$('#drawer').classList.add('open')}function closeCart(){$('#drawer').classList.remove('open')}function card(p){return `<article class="card"><a href="#/product/${p.id}"><img src="${p.image}" alt="${p.name}"></a><div class="body"><div class="cat">${p.category}</div><h3>${p.name}</h3><div class="price">${money(p.price)} <span class="old">${money(p.compareAt)}</span></div><button class="btn add" onclick="add(${p.id})">Add to Cart</button></div></article>`}function home(){return `<main><section class="hero"><div><small>UNIQORA STORE</small><h1>Find<br>Something<br>Different.</h1><p>Unique, useful and giftable products curated for people who like things with personality.</p><a class="btn" href="#/shop">Shop Collection</a></div></section><section class="section"><h2>Trending Now</h2><div class="grid">${products.slice(0,4).map(card).join('')}</div></section><section class="section"><h2>Shop by Category</h2><div class="filters">${['Novelty Mugs & Cups','Home Décor & Trays','Ashtrays & Desk Décor','Cups & Drinkware'].map(x=>`<a class="filter" href="#/shop?cat=${encodeURIComponent(x)}">${x}</a>`).join('')}</div></section></main><footer><b>UNIQORA</b><p>Unique Products. Made to Stand Out.</p></footer>`}function shop(){let q=new URLSearchParams(location.hash.split('?')[1]||'').get('cat')||'All';filter=q;return `<main><section class="section"><h2>Shop All</h2><div class="filters">${['All','Novelty Mugs & Cups','Home Décor & Trays','Ashtrays & Desk Décor','Cups & Drinkware','Stationery & Collectibles','Retro Collectibles'].map(x=>`<button class="filter ${filter===x?'active':''}" onclick="filter='${x.replaceAll("'","\\'")}';renderShop()">${x}</button>`).join('')}</div><div id="grid" class="grid"></div></section></main>`}function renderShop(){let q=($('#search')?.value||'').toLowerCase();let a=products.filter(p=>(filter==='All'||p.category===filter)&&p.name.toLowerCase().includes(q));$('#grid').innerHTML=a.map(card).join('')||'<p>No products found.</p>'}function product(id){let p=products.find(x=>x.id===+id);return `<main><section class="section"><div style="max-width:700px;margin:auto"><img src="${p.image}" style="width:100%;border-radius:22px;box-shadow:0 24px 60px rgba(70,50,28,.16)"><div class="cat" style="margin-top:25px">${p.category}</div><h2>${p.name}</h2><h3>${money(p.price)} <span class="old">${money(p.compareAt)}</span></h3><p style="color:#666;line-height:1.7">${p.description}</p><button class="btn" onclick="add(${p.id})">Add to Cart</button> <a class="btn light" target="_blank" rel="noopener noreferrer" href="https://api.whatsapp.com/send?phone=918683038584&text=${encodeURIComponent('Hi UNIQORA, I want '+p.name+' for '+money(p.price))}">WhatsApp Order</a></div></section></main>`}function checkout(){if(!cart.length)return alert('Your cart is empty');$('#modal').classList.add('open');$('#box').innerHTML=`<h2>Checkout</h2><form class="form" onsubmit="place(event)"><input name="name" placeholder="Full name" required><input name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required><input name="email" type="email" placeholder="Email"><textarea name="address" rows="3" placeholder="Full delivery address" required></textarea><input name="city" placeholder="City" required><input name="pincode" pattern="[0-9]{6}" placeholder="Pincode" required><button class="btn">Place COD Order</button><button type="button" class="btn light" onclick="closeModal()">Cancel</button></form>`}async function place(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.address=`${f.address}, ${f.city} - ${f.pincode}`;let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart,customer:f,paymentMethod:'cod'})}),d=await r.json();if(!r.ok)return alert(d.error||'Order failed');cart=[];save();closeModal();closeCart();alert('Order placed! Order ID: '+d.orderId);location.hash='#/'}function closeModal(){$('#modal').classList.remove('open')}function route(){let h=location.hash||'#/',p=h.split('?')[0];if(p==='#/'||p==='#')$('#app').innerHTML=home();else if(p==='#/shop'){$('#app').innerHTML=shop();renderShop()}else if(p.startsWith('#/product/'))$('#app').innerHTML=product(p.split('/')[2]);else $('#app').innerHTML=home()}addEventListener('hashchange',route);load();</script></body></html>
